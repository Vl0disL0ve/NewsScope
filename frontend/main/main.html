<!-- main.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Главная - Аналитика новостей</title>
  <link rel="stylesheet" href="../common/common.css">
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <div class="app">
    <!-- Шапка -->
    <header class="header">
      <div class="container header-container">
        <h1 class="logo">Аналитика новостей</h1>
        <div class="header-right">
          <span id="userRole" class="role-badge"></span>
          <button id="logoutBtn" class="btn btn-outline">Выйти</button>
        </div>
      </div>
    </header>

    <div class="container main-container">
      <!-- Боковая панель с настройками -->
      <aside class="sidebar card">
        <h3>Настройки</h3>
        
        <div class="form-group">
          <label>Количество кластеров (2-30)</label>
          <input type="range" id="clusterSlider" min="2" max="30" value="10">
          <span id="clusterValue" class="slider-value">10</span>
        </div>

        <div class="form-group">
          <label>Выберите каналы</label>
          <div id="channelsList" class="channels-list">
            <!-- Список каналов загружается из API -->
            <div class="loading-text">Загрузка каналов...</div>
          </div>
          <div class="channel-actions">
            <button id="selectAllBtn" class="btn btn-outline btn-sm">Выбрать всё</button>
            <button id="clearAllBtn" class="btn btn-outline btn-sm">Снять всё</button>
          </div>
        </div>

        <div class="form-group">
          <label>Период для новостей</label>
          <input type="date" id="dateFrom">
          <input type="date" id="dateTo" style="margin-top: 8px;">
        </div>

        <button id="saveSettingsBtn" class="btn btn-primary btn-block">Сохранить настройки</button>
        
        <hr>
        
        <button id="generateSummaryBtn" class="btn btn-primary btn-block">📊 Сделать саммари</button>
        <button id="listenSummaryBtn" class="btn btn-outline btn-block" disabled>🎧 Прослушать подкаст</button>
        <button id="viewGraphBtn" class="btn btn-outline btn-block" disabled>📈 Построить график</button>
        
        <hr>
        
        <button id="historyBtn" class="btn btn-outline btn-block">📜 История</button>
      </aside>

      <!-- Основной контент - результаты -->
      <main class="content card">
        <div id="resultArea">
          <div class="empty-state">
            <p>👋 Нажмите «Сделать саммари» для начала работы</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../common/common.js"></script>
  <script src="main.js"></script>
</body>
</html>
