<!-- main.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Главная - Дайджест новостей</title>
  <link rel="stylesheet" href="../common/common.css">
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <div class="app">
    <!-- Шапка -->
    <header class="header">
      <div class="container header-container">
        <h1 class="logo">Дайджест новостей</h1>
        <div class="header-right">
          <span id="userRole" class="role-badge"></span>
          <button id="logoutBtn" class="btn btn-outline">Выйти</button>
        </div>
      </div>
    </header>

    <div class="container main-container">
      <!-- Боковая панель с настройками -->
      <aside class="sidebar card">
        <h3>Настройки</h3>
        
        <div class="form-group">
          <label>Количество кластеров (2-30)</label>
          <input type="range" id="clusterSlider" min="2" max="30" value="10">
          <span id="clusterValue" class="slider-value">10</span>
        </div>

        <div class="form-group">
          <label>Выберите каналы</label>
          <input type="text" id="channelSearch" class="form-control" placeholder="🔍 Поиск по каналам..." style="margin-bottom: 8px;">
          <div id="channelsList" class="channels-list">
            <div class="loading-text">Загрузка каналов...</div>
          </div>
          <div class="channel-actions">
            <button id="selectAllBtn" class="btn btn-outline btn-sm">Выбрать всё</button>
            <button id="clearAllBtn" class="btn btn-outline btn-sm">Снять всё</button>
          </div>
        </div>

        <div class="form-group">
          <label>Период для новостей</label>
          <div style="display:flex;gap:6px;align-items:center;">
            <input type="date" id="dateFrom" style="width:80%;">
            <input type="time" id="timeFrom" value="00:00" style="width:120px;flex-shrink:0;">
          </div>
          <div style="display:flex;gap:6px;align-items:center;margin-top:4px;">
            <input type="date" id="dateTo" style="width:80%;">
            <input type="time" id="timeTo" value="23:59" style="width:120px;flex-shrink:0;">
          </div>
        </div>

        <button id="saveSettingsBtn" class="btn btn-primary btn-block">Сохранить настройки</button>

        <hr>

        <div class="form-group">
          <label>🔍 Семантический поиск</label>
          <div style="display:flex;gap:6px;">
            <input type="text" id="globalSearch" class="form-control" placeholder="Поиск по смыслу..." style="flex:1;">
            <button id="globalSearchBtn" class="btn btn-primary btn-sm">Искать</button>
          </div>
        </div>

        <hr>

        <button id="generateSummaryBtn" class="btn btn-primary btn-block">Сделать саммари</button>

        <hr>

        <div class="form-group">
          <label>Telegram-канал</label>
          <div style="display:flex;gap:6px;">
            <input type="text" id="tgChannelInput" class="form-control" placeholder="@channel_name" style="flex:1;">
            <button id="loadTgBtn" class="btn btn-primary btn-sm">Загрузить</button>
          </div>
        </div>

        <button id="listenSummaryBtn" class="btn btn-outline btn-block" disabled>Сгенерировать аудио</button>
        <button id="viewGraphBtn" class="btn btn-outline btn-block" disabled>График кластера</button>
        <button id="viewAllGraphBtn" class="btn btn-outline btn-block">Карта всех кластеров</button>
        <button id="buildChronologyBtn" class="btn btn-outline btn-block" disabled>Хронология</button>

        <hr>

        <button id="historyBtn" class="btn btn-outline btn-block">История</button>
        <button id="adminLink" class="btn btn-outline btn-block hidden">Админ-панель</button>
      </aside>

      <!-- Основной контент - результаты -->
      <main class="content card">
        <div id="resultArea">
          <div class="empty-state">
            <p>👋 Нажмите «Сделать саммари» для начала работы</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../common/common.js?v=26"></script>
  <script src="main.js?v=26"></script>
