<!-- login.html -->

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Аналитика новостей</title> <!-- TODO: change title to actual project name-->
    <link rel="stylesheet" href="../common/common.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card card">
            <h1 class="text-center">Вход в систему</h1>
            <p class="text-center" style="color: var(--accent); margin-bottom: 24px;">Войдите в систему</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="login">Логин</label>
                    <input type="text" id="login" name="login" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="telegramMode">
                        Войти через Telegram ID
                    </label>
                </div>

                <div id="telegramIdGroup" class="form-group hidden">
                    <label for="telegramId">Telegram ID</label>
                    <input type="text" id="telegramId" placeholder="Введите ваш Telegram ID">
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">Войти</button>
            </form>

            <hr>
            <p class="text-center" style="font-size: 12px; color: var(--text-primary); opacity:0.6;">
                После 5 неудачных попыток вход блокируется на 15 минут
            </p>
        </div>
    </div>
    
    <script src="../common/common.js?v=2"></script>
    <script src="login.js?v=2"></script>
</body>
</html>
